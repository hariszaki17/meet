# Basic configurations
listening-port=3478
tls-listening-port=5349

# Fingerprint attribute for compatibility with WebRTC clients
fingerprint

# Authentication
use-auth-secret
static-auth-secret=secret
realm=your_realm
# Add this line for specific user credentials
user=devkey:secret

# Relay configurations
total-quota=100
bps-capacity=0
stale-nonce

# Log file location
log-file=/var/log/turn.log

# Security and access control
no-multicast-peers
no-cli

# STUN server configuration
# (STUN functionality is enabled by default when TURN is enabled)
